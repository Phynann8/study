<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Document</title> 
    <style> 
        body{ margin: 0; padding: 0; } 
        h2,p{ margin: 10px; font-size: 30px;} 
        ul{ list-style-type: none; margin: 0; padding: 0; overflow: hidden;
            background-color: #333333; display: flex; justify-content: left; 
            flex-direction: column; position: fixed; width: 20%; height: 100vh; } 
        ul li a{ display: block; color: white; text-align: center;
                 padding: 14px 16px; text-decoration: none; font-size: 30px;} 
        ul li a.active{ background-color: #04AA6D; } 
        ul li a:hover:not(.active){ background-color: 111111; }       
       .content{ margin-left: 20%; padding: 10px; } 
    </style> 
</head> 
<body> 
    <ul> 
        <li><a class="active" href="#home">Home</a></li> 
        <li><a href="#news">News</a></li> 
        <li><a href="#contact">Contact</a></li> 
        <li><a href="#about">About</a></li> 
    </ul> 
    <div class="content"> 
        <h2>1.Vertical Navbar Using Float</h2> 
        <h2>2.Vertical Navbar Using Flex</h2> 
        <h2>3.Vertical Centered Navbar Using Flex</h2> 
        <h2>4.Vertical Navbar with .active</h2> 
        <p>Some text on the website</p> 
    </div>    
</body> 
</html>
