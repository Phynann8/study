<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Code Playground - Khmer Code</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        .playground-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 80px);
            /* Subtract header height */
            max-width: 100%;
            padding: 0;
        }

        .editors {
            display: flex;
            flex: 1;
            border-bottom: 2px solid #ccc;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
        }

        .editor-pane:last-child {
            border-right: none;
        }

        .label {
            background: #eee;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .monaco-container {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .preview-pane {
            flex: 1;
            background: #fff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .run-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #1abc9c;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
            z-index: 100;
        }

        .run-btn:hover {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .editors {
                flex-direction: column;
                flex: none;
                height: 50%;
            }

            .preview-pane {
                height: 50%;
            }
        }
    </style>
</head>

<body>
    <!-- Frozen Header -->
    <header class="header frozen-zone">
        <nav class="navbar">
            <div class="logo">Khmer Code</div>
            <ul class="nav-links">
                <li><a href="index.html" data-i18n="nav_home">Home</a></li>
                <li><a href="csharp-lesson.html" data-i18n="nav_lessons">Lessons</a></li>
                <li><a href="playground.html" data-i18n="nav_playground">Playground</a></li>
                <li><a href="leaderboard.html" data-i18n="nav_leaderboard">Leaderboard</a></li>
                <li><a href="marketplace.html" data-i18n="nav_talent">Talent</a></li>
                <li><a href="mentorship.html" data-i18n="nav_mentors">Mentors</a></li>
                <li><span id="xp-display">Lvl 1 | XP: 0</span></li>
                <li id="auth-nav-container"></li>
                <li>
                    <select id="theme-select" onchange="changeTheme(event)" class="btn-lang"
                        style="background: rgba(0,0,0,0.5); border: 1px solid #fff; color: #fff; border-radius: 10px; padding: 2px 5px;">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                        <option value="cyberpunk">Cyber</option>
                        <option value="royal">Royal</option>
                    </select>
                </li>
                <li><button id="lang-toggle" class="btn-lang">ខ្មែរ</button></li>
            </ul>
        </nav>
    </header>

    <div class="playground-container" style="margin-top: 80px;">
        <div class="editors">
            <div class="editor-pane">
                <div class="label">HTML</div>
                <div id="html-container" class="monaco-container"></div>
            </div>
            <div class="editor-pane">
                <div class="label">CSS</div>
                <div id="css-container" class="monaco-container"></div>
            </div>
            <div class="editor-pane">
                <div class="label">JS</div>
                <div id="js-container" class="monaco-container"></div>
            </div>
        </div>

        <div class="preview-pane">
            <iframe id="preview"></iframe>
        </div>

        <div class="playground-controls"
            style="position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 100;">
            <button class="review-btn" onclick="reviewCode()"
                style="background: #f39c12; color: white; border: none; padding: 15px 25px; border-radius: 50px; font-size: 1.1em; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: transform 0.2s;">Review
                Code 🤖</button>
            <button class="run-btn" onclick="runCode()"
                style="background: #1abc9c; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 1.1em; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: transform 0.2s;">Run
                Code ▶</button>
        </div>

        <!-- AI Feedback Modal -->
        <div id="ai-modal"
            style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 500px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1000; font-family: 'Battambang', sans-serif;">
            <h3 style="margin-top: 0; color: #f39c12;">គ្រូ AI ពិនិត្យកូដ (AI Code Review)</h3>
            <div id="ai-feedback-content" style="margin: 20px 0; line-height: 1.6; color: #444;"></div>
            <button onclick="closeAIModal()"
                style="background: #34495e; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; float: right;">បិទ
                (Close)</button>
        </div>
        <div id="ai-overlay" onclick="closeAIModal()"
            style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999;">
        </div>
    </div>

    <!-- Authentication Modal -->
    <div id="auth-modal"
        style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#fff; padding:30px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.3); z-index:2000; width:90%; max-width:400px; color:#333;">
        <h3 id="modal-title" style="margin-top:0;">Login</h3>
        <div style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:5px;">Email</label>
            <input type="email" id="auth-email"
                style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
        </div>
        <div style="margin-bottom:20px;">
            <label style="display:block; margin-bottom:5px;">Password</label>
            <input type="password" id="auth-password"
                style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <button onclick="handleAuthSubmit()" id="modal-submit-btn" class="btn"
                style="background:#1abc9c; color:#fff; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">Submit</button>
            <a href="javascript:void(0)" onclick="toggleAuthMode()" id="modal-toggle-link"
                style="font-size:0.9rem; color:#1abc9c;">Need an account? Sign Up</a>
        </div>
        <button onclick="document.getElementById('auth-modal').style.display='none'"
            style="position:absolute; top:10px; right:10px; background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
    </div>

    <!-- Load Monaco Editor and Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
    <script src="script.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' } });

        let htmlEditor, cssEditor, jsEditor;

        require(['vs/editor/editor.main'], function () {
            // Initialize HTML Editor
            htmlEditor = monaco.editor.create(document.getElementById('html-container'), {
                value: '<h1>សួស្តី!</h1>\n<p>សាកល្បងកែប្រែអក្សរនេះមើល!</p>\n<button onclick="changeText()">ចុចខ្ញុំ</button>',
                language: 'html',
                theme: 'vs-dark',
                automaticLayout: true
            });

            // Initialize CSS Editor
            cssEditor = monaco.editor.create(document.getElementById('css-container'), {
                value: 'body {\n  font-family: \'Battambang\', sans-serif;\n  text-align: center;\n  color: #333;\n}\nh1 {\n  color: #3498db;\n}\nbutton {\n  padding: 10px 20px;\n  background: #e74c3c;\n  color: white;\n  border: none;\n  border-radius: 5px;\n  cursor: pointer;\n}',
                language: 'css',
                theme: 'vs-dark',
                automaticLayout: true
            });

            // Initialize JS Editor
            jsEditor = monaco.editor.create(document.getElementById('js-container'), {
                value: 'function changeText() {\n  document.querySelector(\'h1\').innerText = "អស្ចារ្យណាស់!";\n  document.querySelector(\'h1\').style.color = "#2ecc71";\n}',
                language: 'javascript',
                theme: 'vs-dark',
                automaticLayout: true
            });

            runCode();
        });

        function runCode() {
            if (!htmlEditor || !cssEditor || !jsEditor) return;

            const html = htmlEditor.getValue();
            const css = cssEditor.getValue();
            const js = jsEditor.getValue();
            const preview = document.getElementById('preview');

            const code = `
        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="UTF-8">
            <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
            <style>
              ${css}
            </style>
          </head>
          <body>
            ${html}
            <script>
              ${js}
            <\/script>
          </body>
        </html>
      `;

            preview.srcdoc = code;
        }

        function reviewCode() {
            const html = htmlEditor.getValue();
            const css = cssEditor.getValue();
            const js = jsEditor.getValue();

            let feedback = "";
            let issues = [];

            // 1. Basic HTML Checks
            if (!html.includes('<html') && !html.includes('<body') && !html.includes('<h')) {
                issues.push("កូដ HTML របស់អ្នកហាក់ដូចជាខ្វះចន្លោះច្រើន។ សាកល្បងបន្ថែម Tag ខ្លះ!");
            }
            if (html.includes('<div') && !html.includes('</div')) {
                issues.push("អ្នកភ្លេចបិទ Tag </div> ហើយ!");
            }

            // 2. CSS Checks
            if (css.includes('{') && !css.includes('}')) {
                issues.push("កូដ CSS របស់អ្នកបាត់បង់សញ្ញា } បិទវិញ។");
            }
            if (!css.includes('font-family')) {
                issues.push("កុំភ្លេចកំណត់ font-family ដើម្បីឱ្យអក្សរស្អាត!");
            }

            // 3. JS Checks
            if (js.includes('function') && !js.includes('{')) {
                issues.push("Function ក្នុង JS ត្រូវការសញ្ញា { } ដើម្បីដាក់កូដខាងក្នុង។");
            }
            if (js.includes('document.querySelector') && !js.includes(')')) {
                issues.push("ពិនិត្យការបើកបិទវង់ក្រចក ( ) ក្នុង JavaScript!");
            }

            if (issues.length === 0) {
                feedback = "🌟 **អស្ចារ្យណាស់!** កូដរបស់អ្នកមើលទៅស្អាត និងគ្មានកំហុសមូលដ្ឋានទេ។ បន្តការងារល្អនេះទៀត!";
            } else {
                feedback = "💡 **មតិយោបល់ពីគ្រូ AI:**<br><br>" + issues.join("<br><br>");
            }

            document.getElementById('ai-feedback-content').innerHTML = feedback;
            document.getElementById('ai-modal').style.display = 'block';
            document.getElementById('ai-overlay').style.display = 'block';
        }

        function closeAIModal() {
            document.getElementById('ai-modal').style.display = 'none';
            document.getElementById('ai-overlay').style.display = 'none';
        }

        window.addEventListener('resize', () => {
            if (htmlEditor) htmlEditor.layout();
            if (cssEditor) cssEditor.layout();
            if (jsEditor) jsEditor.layout();
        });
    </script>
</body>

</html>
