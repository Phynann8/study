<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Import Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>
<body>
  <!-- Header -->
  <header class="header frozen-zone">
    <nav class="navbar">
      <div class="logo">header</div>
            <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav_home">Home</a></li>
        <li><a href="csharp-lesson.html" data-i18n="nav_lessons">Lessons</a></li>
        <li><a href="playground.html" data-i18n="nav_playground">Playground</a></li>
        <li><a href="leaderboard.html" data-i18n="nav_leaderboard">Leaderboard</a></li>
        <li><a href="marketplace.html" data-i18n="nav_talent">Talent</a></li>
        <li><a href="mentorship.html" data-i18n="nav_mentors">Mentors</a></li>
        <li><span id="xp-display">Lvl 1 | XP: 0</span></li>
        <li>
          <select id="theme-select" onchange="changeTheme(event)" class="btn-lang"
            style="background: rgba(0,0,0,0.5); border: 1px solid #fff; color: #fff; border-radius: 10px; padding: 2px 5px;">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="cyberpunk">Cyber</option>
            <option value="royal">Royal</option>
          </select>
        </li>
        <li><button id="lang-toggle" class="btn-lang">ខ្មែរ</button></li>
      </ul>
    </nav>
  </header>
  
  
  <!-- Hero Section -->
  <section id="hero" class="hero">
    <div class="hero-content">
      <h1>Contact Us</h1>
      <p>Get in touch with us for your next big project or just say hello!</p>
    </div>
  </section>
  
  <!-- Contact Form Section -->
  <section id="contact" class="content-section">
    <h2>We’d Love to Hear from You</h2>
    <form id="contactForm">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
      
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
      
      <label for="message">Message:</label>
      <textarea id="message" name="message" required></textarea>
      
      <button type="submit" class="btn">Submit</button>
    </form>
    <div id="formResponse"></div>
  </section>
  
  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 Web3 IT Dev. All Rights Reserved.</p>
  </footer>
  
  <script src="script.js"></script>
</body>
</html>
